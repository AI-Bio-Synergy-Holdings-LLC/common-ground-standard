# Standalone public-repository policy derived from AI-Bio-Synergy-Holdings-LLC/.github/.github/workflows/reusable-policy.yml
# Public vendor contract v1.0.1-p1; canonical source ba36400c48698af5dd799e4e2cd387493054a1c7.
name: Organization policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MAX_ADDED_FILE_BYTES: "10485760"
  ALLOW_LARGE_PATHS: ""

jobs:
  policy:
    name: policy / Organization baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Enforce changed-file policy
        shell: bash
        run: |
          python3 - <<'PY'
          import fnmatch
          import json
          import os
          import pathlib
          import subprocess
          import sys

          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          head = os.environ["GITHUB_SHA"]
          base = None
          pull_request = event.get("pull_request")
          if pull_request:
              base = pull_request["base"]["sha"]
          else:
              candidate = event.get("before")
              if candidate and set(candidate) != {"0"}:
                  base = candidate

          if base:
              command = ["git", "diff", "--no-renames", "--name-only", "--diff-filter=AM", "-z", base, head]
          else:
              command = ["git", "ls-files", "-z"]

          changed = [
              item.decode("utf-8", errors="surrogateescape")
              for item in subprocess.check_output(command).split(b"\0")
              if item
          ]
          allowed = [line.strip() for line in os.environ.get("ALLOW_LARGE_PATHS", "").splitlines() if line.strip()]
          maximum = int(os.environ["MAX_ADDED_FILE_BYTES"])
          violations = []
          literal_git_env = dict(os.environ)
          literal_git_env["GIT_LITERAL_PATHSPECS"] = "1"

          for path in changed:
              normalized = path.replace(os.sep, "/")
              if any(fnmatch.fnmatch(normalized, pattern) for pattern in allowed):
                  continue
              try:
                  entry = subprocess.check_output(
                      ["git", "ls-tree", "-z", "-l", "--full-tree", head, "--", normalized],
                      env=literal_git_env,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  continue
              metadata, separator, _ = entry.partition(b"\t")
              fields = metadata.split()
              if not separator or len(fields) != 4 or fields[1] != b"blob" or fields[3] == b"-":
                  continue
              size = int(fields[3])
              if size > maximum:
                  violations.append((normalized, size))

          summary_path = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("## Organization baseline\n\n")
              summary.write(f"Inspected {len(changed)} tracked paths in policy scope.\n\n")
              summary.write(f"Maximum permitted Git blob size: {maximum:,} bytes.\n")

          if violations:
              def escape_workflow_property(value):
                  return (value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          .replace(":", "%3A").replace(",", "%2C"))

              for path, size in violations:
                  print(f"::error file={escape_workflow_property(path)}::{size:,}-byte file exceeds the {maximum:,}-byte Git policy")
              print("Move large deliverables to Releases, Git LFS, or controlled artifact storage.")
              sys.exit(1)
          PY
